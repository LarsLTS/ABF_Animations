name: Trunk Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  trunk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1
        with:
          check-mode: all
